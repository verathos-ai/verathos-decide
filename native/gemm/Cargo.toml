[package]
name = "verathos-gemm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "verathos_gemm"
crate-type = ["cdylib"]

[dependencies]
rayon = "=1.12.0"
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"

[target.'cfg(target_arch = "x86_64")'.dependencies]
halo2curves = { version = "=0.9.0", default-features = false, features = ["std", "asm"] }

[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
halo2curves = { version = "=0.9.0", default-features = false, features = ["std"] }
