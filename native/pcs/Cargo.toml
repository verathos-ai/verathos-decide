[package]
name = "verathos-pcs-v2"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "verathos_pcs_v2"
crate-type = ["cdylib", "rlib"]

[dependencies]
bincode = { version = "=2.0.1", features = ["serde"] }
ff = "=0.13.1"
nova-snark = { version = "=0.73.0", default-features = false }
num-bigint = "=0.4.8"
rayon = "=1.12.0"
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"
sha3 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "unwind"

[target.'cfg(target_arch = "x86_64")'.dependencies]
halo2curves = { version = "=0.9.0", default-features = false, features = ["std", "bits", "derive_serde", "asm"] }

[target.'cfg(not(target_arch = "x86_64"))'.dependencies]
halo2curves = { version = "=0.9.0", default-features = false, features = ["std", "bits", "derive_serde"] }
