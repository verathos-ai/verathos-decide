name: Proposal
description: A change or a new feature. A larger change is agreed here before its pull request.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What does not work or is missing, and for whom (miners, validators, users, the subnet owner).
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change, and what it changes for nodes on the current release.
    validations:
      required: true
