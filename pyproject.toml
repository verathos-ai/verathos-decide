[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "verathos"
version = "0.0.1"
description = "Decision-model network on Bittensor: typed answers with calibrated probabilities, verified by reference recomputation"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.9",
    "bittensor-wallet>=4.0",
]

[project.optional-dependencies]
server = ["fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27"]
chain = ["bittensor==10.3.2"]
test = ["pytest>=8", "fastapi>=0.115", "httpx>=0.27"]
capacity = ["numpy>=2", "torch>=2.10,<2.11", "blake3>=1.0", "setuptools>=77", "ninja>=1.11"]
ops = ["keyring>=25", "secretstorage>=3.3"]

[project.scripts]
verathos-miner = "verathos.miner.__main__:main"
verathos-validator = "verathos.validator.__main__:main"
verathos-build-native = "verathos.capacity.build_native:main"
verathos-owner = "verathos.owner:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["verathos*"]

[tool.setuptools.package-data]
"verathos.catalog" = ["catalog.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B905"]
